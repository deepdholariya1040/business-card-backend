# Example Nginx reverse proxy config for the OCR SaaS backend.
# Place at /etc/nginx/sites-available/ocr-saas-backend and symlink
# into sites-enabled, or adapt for your platform's ingress config.

upstream ocr_saas_backend {
    server 127.0.0.1:5000;
    keepalive 64;
}

server {
    listen 80;
    server_name api.yourdomain.com;

    # Redirect all HTTP to HTTPS in production
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;

    client_max_body_size 15m; # allow room above MAX_FILE_SIZE_MB

    # Preserve real client info + protocol so req.ip / req.protocol
    # and the image-URL builder (SERVER_URL fallback) work correctly.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    location / {
        proxy_pass http://ocr_saas_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Serve uploaded images with long-lived caching at the edge.
    location /uploads/ {
        proxy_pass http://ocr_saas_backend;
        proxy_cache_valid 200 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}
